<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Formpilot test form</title>
  </head>
  <body>
    <form>
      <label
        >GitHub URL
        <input
          id="github"
          type="url"
          name="github-url"
          aria-label="GitHub profile"
          placeholder="Your GitHub URL"
      /></label>
      <label
        >Postal code <input id="postal" autocomplete="postal-code"
      /></label>
      <label>Full name <input id="full-name" autocomplete="name" /></label>
      <label>Text <input id="text" /></label
      ><label>Notes <textarea id="notes"></textarea></label
      ><select id="select">
        <option value="a">Alpha</option>
        <option value="b">Beta</option></select
      ><input id="file" type="file" accept=".txt" /><input
        id="second-file"
        type="file"
      /><input id="number" type="number" value="42" /><input
        id="readonly"
        readonly
      /><input id="disabled" disabled />
    </form>
    <div contenteditable="true" id="editable">Original</div>
    <div id="shadow"></div>
    <iframe src="frame.html"></iframe
    ><iframe src="http://127.0.0.1:8765/tests/frame.html"></iframe>
    <script>
      const root = document
        .getElementById("shadow")
        .attachShadow({ mode: "open" });
      root.innerHTML = '<input id="shadow-input">';
    </script>
  </body>
</html>
